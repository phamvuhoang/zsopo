name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Start Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare
      - name: Export Supabase URL and publishable key (from the running stack, never hard-coded)
        run: |
          pnpm exec supabase status -o env > /tmp/supabase.env
          url=$(sed -n 's/^API_URL="\(.*\)"$/\1/p' /tmp/supabase.env)
          key=$(sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p' /tmp/supabase.env)
          secret=$(sed -n 's/^SECRET_KEY="\(.*\)"$/\1/p' /tmp/supabase.env)
          jwt=$(sed -n 's/^JWT_SECRET="\(.*\)"$/\1/p' /tmp/supabase.env)
          test -n "$url" && test -n "$key" && test -n "$secret" && test -n "$jwt"
          echo "::add-mask::$secret"
          echo "::add-mask::$jwt"
          { echo "NEXT_PUBLIC_SUPABASE_URL=$url"; echo "SUPABASE_URL=$url"; echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key"; echo "SUPABASE_PUBLISHABLE_KEY=$key"; echo "SUPABASE_SERVICE_ROLE_KEY=$secret"; echo "SUPABASE_JWT_SECRET=$jwt"; } >> "$GITHUB_ENV"
      - run: pnpm test:db
      - run: pnpm check:rls
      - run: pnpm check:types
      - run: pnpm check:seed
      - name: Serve Edge Functions
        run: |
          cp supabase/functions/.env.example supabase/functions/.env
          pnpm exec supabase functions serve > /tmp/functions.log 2>&1 &
          sleep 10
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "1"
      - name: No elevated secret in client bundle
        run: "! grep -rE 'sb_secret_|service_role' apps/web/.next/static"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  # Staging on main, production on tag v*. Requires repository secrets listed in docs/setup.md.
  deploy:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migration dry-run
        run: pnpm exec supabase db push --dry-run
      - run: pnpm exec supabase db push
      - run: pnpm exec supabase functions deploy
      - name: Deploy web (Vercel)
        run: pnpm dlx vercel@latest deploy --prebuilt=false ${{ startsWith(github.ref, 'refs/tags/v') && '--prod' || '' }} --token "${{ secrets.VERCEL_TOKEN }}"
