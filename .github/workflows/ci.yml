name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Start Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare
      - name: Export Supabase URL and publishable key (from the running stack, never hard-coded)
        run: |
          pnpm exec supabase status -o env > /tmp/supabase.env
          url=$(sed -n 's/^API_URL="\(.*\)"$/\1/p' /tmp/supabase.env)
          key=$(sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p' /tmp/supabase.env)
          secret=$(sed -n 's/^SECRET_KEY="\(.*\)"$/\1/p' /tmp/supabase.env)
          test -n "$url" && test -n "$key" && test -n "$secret"
          echo "::add-mask::$secret"
          { echo "NEXT_PUBLIC_SUPABASE_URL=$url"; echo "SUPABASE_URL=$url"; echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key"; echo "SUPABASE_PUBLISHABLE_KEY=$key"; echo "SUPABASE_SERVICE_ROLE_KEY=$secret"; } >> "$GITHUB_ENV"
      - run: pnpm test:db
      - run: pnpm check:rls
      - run: pnpm check:types
      - run: pnpm check:seed
      - name: Serve Edge Functions
        run: |
          cp supabase/functions/.env.example supabase/functions/.env
          pnpm exec supabase functions serve > /tmp/functions.log 2>&1 &
          sleep 10
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "1"
      - name: No elevated secret in client bundle
        run: "! grep -rE 'sb_secret_|service_role' apps/web/.next/static"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
