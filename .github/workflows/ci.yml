name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55421
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Start Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare
      - name: Export publishable key
        run: echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(pnpm exec supabase status -o env | sed -n 's/^PUBLISHABLE_KEY=\"\(.*\)\"$/\1/p')" >> "$GITHUB_ENV"
      - run: pnpm test:db
      - run: pnpm check:rls
      - run: pnpm check:types
      - run: pnpm check:seed
      - name: Serve Edge Functions
        run: pnpm exec supabase functions serve > /tmp/functions.log 2>&1 &
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "1"
      - name: No elevated secret in client bundle
        run: "! grep -rE 'sb_secret_|service_role' apps/web/.next/static"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
